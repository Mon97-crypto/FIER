<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin · Rare Collections by Sathish</title>
  <link rel="icon" href="/img/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,900;1,9..144,300&family=Manrope:wght@400;600;700;800&family=Anton&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { padding: 24px clamp(14px, 4vw, 48px); background: #f3ede3; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .top h1 { font-family: var(--serif); font-weight: 700; font-size: 34px; margin: 0; letter-spacing: 2px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { padding: 16px; border-radius: 18px; background: #fff; border: 1px solid var(--line); }
    .stat b { display: block; font-family: var(--serif); font-size: 32px; font-weight: 700; }
    .stat span { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--gold); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    td select, td input { padding: 7px 9px; border-radius: 10px; font-size: 13px; background: #fff; color: var(--ink); border: 1px solid var(--line); }
    td input { width: 130px; }
    .items a { color: var(--teal); font-size: 12px; }
    .wrap { overflow-x: auto; background: rgba(255,255,255,.55); border: 1px solid var(--line); border-radius: 20px; padding: 6px 10px; }
    .login { max-width: 380px; margin: 12vh auto; display: grid; gap: 12px; text-align: center; }
    .designs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .designs .d { padding: 12px; border-radius: 18px; background: #fff; border: 1px solid var(--line); text-align: center; }
    .designs .d a { display: inline-block; margin: 4px; font-size: 12px; color: var(--teal); }
  </style>
</head>
<body>
  
  <form class="login" id="login">
    <h1 style="font-family:var(--serif);font-weight:900;font-size:64px;margin:0;line-height:1">Rare <em style="font-weight:300;color:var(--ember)">admin</em></h1>
    <input type="password" name="key" placeholder="Admin key (printed in the server console)" required />
    <button class="btn primary" type="submit">Enter</button>
    <p class="err" id="err"></p>
  </form>
  <div id="app" hidden>
    <div class="top">
      <h1>Rare Collections · <em>Control room</em></h1>
      <div class="row gap"><button class="btn ghost sm" id="refresh">Refresh</button><button class="btn ghost sm" id="logout">Lock</button></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button class="chip active" data-tab="orders">Orders</button>
      <button class="chip" data-tab="print">DTF print files</button>
      <button class="chip" data-tab="subs">Subscribers</button>
    </div>
    <div id="orders" class="wrap"></div>
    <div id="print" hidden></div>
    <div id="subs" hidden></div>
  </div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
